syntax = "proto3";

package songServices;
option go_package = "/songServices";

service SongService {
  rpc GetGenres(Empty) returns (ResponseGenresDTO);
  rpc GetSongsByGenre(SongsByGenreRequest) returns (ResponseSongsDTO);
  rpc GetSong(SongRequest) returns (ResponseSongDTO);
  rpc SaveSong(SaveSongRequest) returns (SaveSongResponse);  // ← NUEVO
}

message Empty {}

message SongsByGenreRequest {
  string genreName = 1;
}

message SongRequest {
  string title = 1;
}

// NUEVO: Mensaje para guardar canción
message SaveSongRequest {
  string title = 1;
  string artist = 2;
  string year = 3;
  string duration = 4;
  string language = 5;
  string genre = 6;
  bytes fileContent = 7;  // Contenido binario del archivo MP3
}

// NUEVO: Respuesta al guardar
message SaveSongResponse {
  int32 code = 1;
  string message = 2;
  string songId = 3;
}

message Genre {
	int32 id = 1;
	string name = 2;
}

message Song {
	int32 id = 1;
  string title = 2;
  string artist = 3;
	string year = 4;
	string duration = 5;
  string language = 6;
	Genre genre = 7;
}

message ResponseSongDTO {
  Song songObj = 1;
  int32 code = 2;
  string message = 3;
}

message ResponseSongsDTO {
  repeated Song songsObjArr = 1;
  int32 code = 2;
  string message = 3;
}

message ResponseGenresDTO {
  repeated Genre genresObjArr = 1;
  int32 code = 2;
  string message = 3;
}
